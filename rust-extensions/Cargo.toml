[package]
name = "rust-extensions"
version = "0.1.5"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
objects-pool = []
base64 = ["dep:base64"]
hex = []
# gates everything that needs a source of randomness: `uuid::generate_v4()` and `SortableId`
rnd = ["dep:uuid"]
with-tokio = ["tokio", "signal-hook", "futures", "rnd"]

vec-maybe-stack = []


[dependencies]
tokio = { version = "*", features = [
    "time",
    "sync",
    "rt",
    "io-util",
    "fs",
], optional = true }
futures = { version = "*", optional = true }
chrono = "*"
async-trait = "*"
signal-hook = { version = "*", optional = true }
base64 = { version = "*", optional = true }
serde = { version = "*", features = ["derive"] }
macros = { path = "../macros" }
parking_lot = "*"

# `uuid` refuses to compile on `wasm32-unknown-unknown` without one of its randomness features, and
# `uuid::generate_v4()` does not go through it there anyway - so keep it out of the wasm graph.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uuid = { version = "*", features = ["v4"], optional = true }

# `chrono`'s default features already pull `js-sys` in on wasm - this makes the dependency explicit,
# `uuid::generate_v4()` and `DateTimeAsMicroseconds::now()` need it there.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
serde_json = "*"
criterion = "*"
