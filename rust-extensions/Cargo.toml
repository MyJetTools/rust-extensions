[package]
name = "rust-extensions"
version = "0.1.5"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
objects-pool = ["tokio"]
base64 = ["dep:base64"]
hex = []
# gates everything that needs a source of randomness: `uuid::generate_v4()` and `SortableId`
rnd = ["dep:uuid"]
with-tokio = ["tokio", "signal-hook", "futures", "rnd"]

vec-maybe-stack = []


[dependencies]
futures = { version = "*", optional = true }
chrono = "*"
async-trait = "*"
base64 = { version = "*", optional = true }
serde = { version = "*", features = ["derive"] }
macros = { path = "../macros" }
parking_lot = "*"

# Three deps have no wasm story at all, so they are kept out of the wasm graph entirely:
#   * `signal-hook` pulls `errno`, which refuses to build for an "unknown" target OS - and POSIX
#     signals do not exist in a browser anyway.
#   * `tokio`'s `fs` feature is rejected on wasm ("Only features sync,macros,io-util,rt,time are
#     supported"), so wasm gets the same dependency minus `fs`.
#   * `uuid` fails with a `compile_error!` unless one of its randomness features is on, and
#     `uuid::generate_v4()` does not go through it on wasm anyway.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "*", features = [
    "time",
    "sync",
    "rt",
    "io-util",
    "fs",
], optional = true }
signal-hook = { version = "*", optional = true }
uuid = { version = "*", features = ["v4"], optional = true }

# `chrono`'s default features already pull `js-sys` in on wasm - this makes the dependency explicit,
# `uuid::generate_v4()` and `DateTimeAsMicroseconds::now()` need it there.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "*", features = [
    "time",
    "sync",
    "rt",
    "io-util",
], optional = true }
js-sys = "0.3"

[dev-dependencies]
serde_json = "*"
criterion = "*"
